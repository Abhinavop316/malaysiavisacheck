<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <rect width="400" height="240" fill="#F8FAFC" />

  <!-- Desk Surface (Perspective) -->
  <polygon points="0,170 400,170 400,240 0,240" fill="#E2E8F0" />
  <!-- Open Laptop Corner on Desk -->
  <polygon points="100,165 300,165 340,230 60,230" fill="#94A3B8" opacity="0.6" />

  <!-- Left Hand Holding Gold Credit Card Upward -->
  <g transform="translate(140, 20) rotate(-12)">
    <!-- Credit Card -->
    <rect x="0" y="20" width="105" height="65" rx="5" fill="url(#cardGrad)" stroke="#B45309" stroke-width="1.5" />
    <!-- Chip -->
    <rect x="12" y="38" width="15" height="12" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1" />
    <!-- Card stripes/numbers -->
    <rect x="12" y="62" width="60" height="5" rx="1" fill="#FEF3C7" opacity="0.8" />
    <circle cx="85" cy="45" r="7" fill="#EF4444" opacity="0.8" />
    <circle cx="93" cy="45" r="7" fill="#FCD34D" opacity="0.8" />
  </g>

  <!-- Hand Holding Phone (Right) -->
  <g transform="translate(240, 45) rotate(10)">
    <!-- Smartphone -->
    <rect x="0" y="0" width="55" height="105" rx="8" fill="url(#phoneGrad)" stroke="#64748B" stroke-width="2" />
    <!-- Screen -->
    <rect x="4" y="8" width="47" height="88" rx="4" fill="#E0F2FE" />
    <!-- Checkmark on screen -->
    <circle cx="27" cy="45" r="14" fill="#10B981" />
    <path d="M 21,45 L 25,49 L 33,40" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Person Hands & Shirt (Light Cream/White) -->
  <path d="M 120,240 C 120,180 180,110 200,90" stroke="#FDE68A" stroke-width="38" stroke-linecap="round" fill="none" opacity="0.5" />
  <path d="M 290,240 C 290,190 270,140 260,110" stroke="#FDE68A" stroke-width="32" stroke-linecap="round" fill="none" opacity="0.5" />
</svg>
