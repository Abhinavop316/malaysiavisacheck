<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="crestGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#e8f0fe" stop-opacity="0.1" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f" />
      <stop offset="50%" stop-color="#ffb300" />
      <stop offset="100%" stop-color="#ff8f00" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a2558" />
      <stop offset="100%" stop-color="#051433" />
    </linearGradient>
  </defs>

  <!-- Outer Ring Shield -->
  <circle cx="100" cy="100" r="95" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="4" />
  <circle cx="100" cy="100" r="87" fill="none" stroke="#ffd54f" stroke-width="1.5" stroke-dasharray="4,3" />

  <!-- Inner Seal -->
  <circle cx="100" cy="100" r="76" fill="#0d2b6b" />

  <!-- Laurel Garland Leaves Left & Right -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round">
    <path d="M 40,110 C 35,75 55,45 80,35" />
    <path d="M 160,110 C 165,75 145,45 120,35" />
  </g>
  <!-- Laurel Leaf nodes -->
  <g fill="#ffd54f">
    <circle cx="43" cy="98" r="4" />
    <circle cx="40" cy="80" r="4" />
    <circle cx="45" cy="62" r="4" />
    <circle cx="56" cy="48" r="4" />
    <circle cx="72" cy="38" r="4" />

    <circle cx="157" cy="98" r="4" />
    <circle cx="160" cy="80" r="4" />
    <circle cx="155" cy="62" r="4" />
    <circle cx="144" cy="48" r="4" />
    <circle cx="128" cy="38" r="4" />
  </g>

  <!-- Central Crescent (Yellow/Gold) -->
  <path fill="#ffd54f" d="M 88 56 A 28 28 0 1 0 88 116 A 23 23 0 1 1 88 56 Z" />

  <!-- 14-pointed Star -->
  <g transform="translate(118, 86) scale(0.65)">
    <circle r="12" fill="#ffd54f" />
    <!-- 14 rays -->
    <polygon fill="#ffd54f" points="0,-36 3,-12 0,0 -3,-12" />
    <polygon fill="#ffd54f" points="0,-36 3,-12 0,0 -3,-12" transform="rotate(25.714)" />
    <polygon fill="#ffd54f" points="0,-36 3,-12 0,0 -3,-12" transform="rotate(51.428)" />
    <polygon fill="#ffd54f" points="0,-36 3,-12 0,0 -3,-12" transform="rotate(77.142)" />
    <polygon fill="#ffd54f" points="0,-36 3,-12 0,0 -3,-12" transform="rotate(102.856)" />
    <polygon fill="#ffd54f" points="0,-36 3,-12 0,0 -3,-12" transform="rotate(128.570)" />
    <polygon fill="#ffd54f" points="0,-36 3,-12 0,0 -3,-12" transform="rotate(154.284)" />
    <polygon fill="#ffd54f" points="0,-36 3,-12 0,0 -3,-12" transform="rotate(179.998)" />
    <polygon fill="#ffd54f" points="0,-36 3,-12 0,0 -3,-12" transform="rotate(205.712)" />
    <polygon fill="#ffd54f" points="0,-36 3,-12 0,0 -3,-12" transform="rotate(231.426)" />
    <polygon fill="#ffd54f" points="0,-36 3,-12 0,0 -3,-12" transform="rotate(257.140)" />
    <polygon fill="#ffd54f" points="0,-36 3,-12 0,0 -3,-12" transform="rotate(282.854)" />
    <polygon fill="#ffd54f" points="0,-36 3,-12 0,0 -3,-12" transform="rotate(308.568)" />
    <polygon fill="#ffd54f" points="0,-36 3,-12 0,0 -3,-12" transform="rotate(334.282)" />
  </g>

  <!-- Banner at base -->
  <path d="M 30,138 Q 100,165 170,138 L 165,160 Q 100,182 35,160 Z" fill="#b71c1c" stroke="#ffd54f" stroke-width="1.5" />
  <text x="100" y="153" text-anchor="middle" font-family="'Outfit', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" letter-spacing="1.5">eVISA MALAYSIA</text>

  <!-- Subtext arch/bottom -->
  <text x="100" y="128" text-anchor="middle" font-family="'Open Sans', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#e0e0e0" letter-spacing="1">IMMIGRATION INQUIRY</text>
</svg>
