<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 65" width="380" height="65">
  <defs>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>
  </defs>

  <!-- Left Emblem / Crest -->
  <g transform="translate(5, 2)">
    <!-- Shield / Badge -->
    <path d="M 30,5 C 48,5 55,18 55,30 C 55,48 30,60 30,60 C 30,60 5,48 5,30 C 5,18 12,5 30,5 Z" fill="#0D2B66" stroke="url(#goldShine)" stroke-width="2" />
    <path d="M 30,9 C 45,9 51,19 51,29 C 51,44 30,54 30,54 C 30,54 9,44 9,29 C 9,19 15,9 30,9 Z" fill="#B71C1C" />
    <!-- Yellow Crescent & Star -->
    <path d="M 28,18 A 10 10 0 1 0 28,38 A 8 8 0 1 1 28,18 Z" fill="#FFD54F" />
    <circle cx="36" cy="28" r="4.5" fill="#FFD54F" />
    <!-- Banner ribbon at bottom of shield -->
    <path d="M 12,48 Q 30,55 48,48 L 46,54 Q 30,60 14,54 Z" fill="#FFD54F" />
  </g>

  <!-- Text Group -->
  <g transform="translate(70, 0)">
    <text x="0" y="32" font-family="'Outfit', 'Montserrat', 'Arial', sans-serif" font-weight="900" font-size="18.5" fill="#111827" letter-spacing="0.02em">
      JABATAN IMIGRESEN MALAYSIA
    </text>
    <text x="0" y="49" font-family="'Outfit', 'Open Sans', 'Arial', sans-serif" font-weight="600" font-size="11.5" fill="#374151" letter-spacing="0.08em">
      IMMIGRATION DEPARTMENT OF MALAYSIA
    </text>
  </g>
</svg>
