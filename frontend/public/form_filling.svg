<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 380" width="450" height="380">
  <defs>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="sleeveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>
    <linearGradient id="penGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <rect width="450" height="380" fill="url(#bgLight)" rx="6" />

  <!-- Leather Clipboard (Black/Dark Slate) -->
  <polygon points="50,330 350,370 380,240 80,200" fill="#0F172A" />
  <rect x="50" y="210" width="310" height="150" rx="6" fill="#1E293B" transform="rotate(7, 205, 285)" />

  <!-- Paper Form -->
  <rect x="70" y="215" width="270" height="130" fill="#FFFFFF" rx="2" transform="rotate(7, 205, 280)" />

  <!-- Form Lines & Fields on Paper -->
  <g stroke="#CBD5E1" stroke-width="2" transform="rotate(7, 205, 280)">
    <line x1="85" y1="235" x2="180" y2="235" stroke="#94A3B8" stroke-width="4" />
    <line x1="85" y1="250" x2="320" y2="250" />
    <line x1="85" y1="265" x2="320" y2="265" />
    <line x1="85" y1="280" x2="260" y2="280" />
    <line x1="85" y1="295" x2="300" y2="295" />
    <line x1="85" y1="310" x2="240" y2="310" />
  </g>

  <!-- Reading Glasses on Table (Left) -->
  <g stroke="#334155" stroke-width="3" fill="none" opacity="0.85">
    <circle cx="65" cy="275" r="16" />
    <circle cx="102" cy="275" r="16" />
    <path d="M 81,275 Q 84,271 86,275" />
    <line x1="49" y1="272" x2="35" y2="295" />
    <line x1="118" y1="272" x2="132" y2="295" />
  </g>

  <!-- Arm with Light Blue Business Shirt -->
  <path d="M 200,90 C 210,130 250,220 270,250 L 360,200 C 330,170 300,100 280,60 Z" fill="url(#sleeveGrad)" />

  <!-- Hand Holding Pen -->
  <path d="M 235,245 C 240,230 260,240 255,260 C 250,275 235,285 220,280 C 205,275 210,255 225,250 Z" fill="#FBCFE8" opacity="0.8" />
  <!-- Fingers holding pen -->
  <path d="M 215,265 C 220,250 238,255 232,272 C 226,285 210,280 215,265 Z" fill="#F87171" opacity="0.4" />
  <circle cx="218" cy="265" r="14" fill="#FBCFE8" />

  <!-- Gold Fountain Pen -->
  <polygon points="180,165 240,270 245,266 186,162" fill="url(#penGold)" />
  <!-- Nib -->
  <polygon points="240,270 248,284 245,266" fill="#1E293B" />
  <polygon points="244,276 248,284 246,274" fill="#FCD34D" />
</svg>
