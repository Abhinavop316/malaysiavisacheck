    <polygon fill="#fcdd09" points="0,-50 4,-16 0,0 -4,-16" transform="rotate(205.712)" />
    <polygon fill="#fcdd09" points="0,-50 4,-16 0,0 -4,-16" transform="rotate(231.426)" />
