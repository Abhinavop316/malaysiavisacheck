  <rect y="200" width="560" height="20" fill="#cc0000" />
  <rect y="240" width="560" height="20" fill="#cc0000" />

  <!-- Blue Canton: 280px wide (half width), 160px high (top 8 stripes) -->
  <rect width="280" height="160" fill="#000066" />

  <!-- Yellow Crescent -->
