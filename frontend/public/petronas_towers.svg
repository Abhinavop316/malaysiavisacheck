<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 450" width="240" height="450">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040D1A" />
      <stop offset="50%" stop-color="#0A1D36" />
      <stop offset="100%" stop-color="#142B4D" />
    </linearGradient>
    <linearGradient id="towerGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D7E8F7" />
      <stop offset="40%" stop-color="#FFFDF0" />
      <stop offset="70%" stop-color="#E2F1FC" />
      <stop offset="100%" stop-color="#A5C6E5" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="100%" stop-color="#FFD54F" />
    </linearGradient>
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Night Sky -->
  <rect width="240" height="450" fill="url(#nightSky)" />

  <!-- Stars / City shimmer in distance -->
  <circle cx="30" cy="40" r="1" fill="#FFFFFF" opacity="0.7" />
  <circle cx="85" cy="25" r="1.5" fill="#FFFFFF" opacity="0.9" />
  <circle cx="210" cy="50" r="1" fill="#FFFFFF" opacity="0.6" />
  <circle cx="190" cy="90" r="1" fill="#FFFFFF" opacity="0.8" />

  <!-- Surrounding City Buildings Silhouette (Dark) -->
  <rect x="0" y="320" width="45" height="130" fill="#061224" />
  <rect x="195" y="300" width="45" height="150" fill="#08152B" />

  <!-- Distant Building Window Lights -->
  <g fill="#FBC02D" opacity="0.6">
    <rect x="10" y="340" width="3" height="4" />
    <rect x="20" y="340" width="3" height="4" />
    <rect x="10" y="360" width="3" height="4" />
    <rect x="25" y="375" width="3" height="4" />
    <rect x="205" y="320" width="3" height="4" />
    <rect x="215" y="320" width="3" height="4" />
    <rect x="205" y="345" width="3" height="4" />
  </g>

  <!-- PETRONAS TOWER 1 (Left, Center at x=95) -->
  <!-- Base Section -->
  <path d="M 68,450 L 72,260 L 118,260 L 122,450 Z" fill="url(#towerGlow)" filter="url(#bloom)" />
  <!-- Mid Tier 1 -->
  <path d="M 74,260 L 78,170 L 112,170 L 116,260 Z" fill="url(#towerGlow)" />
  <!-- Mid Tier 2 -->
  <path d="M 80,170 L 83,100 L 107,100 L 110,170 Z" fill="url(#towerGlow)" />
  <!-- Upper Tier 3 -->
  <path d="M 84,100 L 88,50 L 102,50 L 106,100 Z" fill="url(#towerGlow)" />
  <!-- Spire Dome -->
  <path d="M 88,50 Q 95,35 102,50 Z" fill="#FFFFFF" />
  <!-- Spire Needle Antenna -->
  <line x1="95" y1="36" x2="95" y2="5" stroke="#FFFFFF" stroke-width="2.5" />
  <circle cx="95" cy="5" r="2" fill="#FF1744" /> <!-- Aviation Warning Light -->

  <!-- PETRONAS TOWER 2 (Right, Center at x=165) -->
  <!-- Base Section -->
  <path d="M 138,450 L 142,260 L 188,260 L 192,450 Z" fill="url(#towerGlow)" filter="url(#bloom)" />
  <!-- Mid Tier 1 -->
  <path d="M 144,260 L 148,170 L 182,170 L 186,260 Z" fill="url(#towerGlow)" />
  <!-- Mid Tier 2 -->
  <path d="M 150,170 L 153,100 L 177,100 L 180,170 Z" fill="url(#towerGlow)" />
  <!-- Upper Tier 3 -->
  <path d="M 154,100 L 158,50 L 172,50 L 176,100 Z" fill="url(#towerGlow)" />
  <!-- Spire Dome -->
  <path d="M 158,50 Q 165,35 172,50 Z" fill="#FFFFFF" />
  <!-- Spire Needle Antenna -->
  <line x1="165" y1="36" x2="165" y2="5" stroke="#FFFFFF" stroke-width="2.5" />
  <circle cx="165" cy="5" r="2" fill="#FF1744" /> <!-- Aviation Warning Light -->

  <!-- Skybridge connecting Towers at Floor 41/42 (approx y=210) -->
  <rect x="110" y="206" width="40" height="10" fill="#E0F2FE" />
  <line x1="110" y1="216" x2="150" y2="216" stroke="#0D2B66" stroke-width="1.5" />
  <!-- Skybridge diagonal support struts -->
  <line x1="130" y1="216" x2="114" y2="240" stroke="#E0F2FE" stroke-width="2" />
  <line x1="130" y1="216" x2="146" y2="240" stroke="#E0F2FE" stroke-width="2" />

  <!-- Horizontal Floor Rings (Lit Up) -->
  <g stroke="#FFFFFF" stroke-width="1" opacity="0.85">
    <!-- Tower 1 rings -->
    <line x1="73" y1="280" x2="117" y2="280" />
    <line x1="74" y1="310" x2="116" y2="310" />
    <line x1="75" y1="340" x2="115" y2="340" />
    <line x1="76" y1="370" x2="114" y2="370" />
    <line x1="77" y1="400" x2="113" y2="400" />
    <line x1="79" y1="230" x2="111" y2="230" />
    <line x1="80" y1="200" x2="110" y2="200" />
    <line x1="82" y1="140" x2="108" y2="140" />
    <line x1="85" y1="80" x2="105" y2="80" />

    <!-- Tower 2 rings -->
    <line x1="143" y1="280" x2="187" y2="280" />
    <line x1="144" y1="310" x2="186" y2="310" />
    <line x1="145" y1="340" x2="185" y2="340" />
    <line x1="146" y1="370" x2="184" y2="370" />
    <line x1="147" y1="400" x2="183" y2="400" />
    <line x1="149" y1="230" x2="181" y2="230" />
    <line x1="150" y1="200" x2="180" y2="200" />
    <line x1="152" y1="140" x2="178" y2="140" />
    <line x1="155" y1="80" x2="175" y2="80" />
  </g>

  <!-- Ambient Golden Glow at Bottom of Towers -->
  <ellipse cx="130" cy="445" rx="100" ry="25" fill="#FFD54F" opacity="0.35" filter="url(#bloom)" />
</svg>
