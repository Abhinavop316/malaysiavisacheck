<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="holoDoc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <rect width="400" height="240" fill="#F1F5F9" />

  <!-- Laptop Base & Keyboard (Perspective) -->
  <polygon points="60,210 340,210 380,235 20,235" fill="url(#laptopGrad)" />
  <polygon points="80,213 320,213 345,228 55,228" fill="#334155" />
  <!-- Trackpad -->
  <rect x="175" y="229" width="50" height="5" fill="#475569" rx="1" />

  <!-- Laptop Screen -->
  <polygon points="90,70 310,70 330,208 70,208" fill="#0F172A" />
  <polygon points="98,78 302,78 322,200 78,200" fill="url(#screenGrad)" />

  <!-- Holographic Floating Documents (Apply) -->
  <!-- Back Doc -->
  <rect x="130" y="30" width="75" height="95" rx="3" fill="url(#holoDoc)" stroke="#38BDF8" stroke-width="1.5" transform="rotate(-8, 167, 77)" />
  <!-- Front Doc -->
  <rect x="175" y="45" width="80" height="105" rx="3" fill="url(#holoDoc)" stroke="#0284C7" stroke-width="2" transform="rotate(6, 215, 97)" />

  <!-- Holographic Form Lines -->
  <g stroke="#0284C7" stroke-width="2" transform="rotate(6, 215, 97)" opacity="0.8">
    <line x1="190" y1="65" x2="235" y2="65" stroke-width="3" />
    <line x1="190" y1="80" x2="245" y2="80" />
    <line x1="190" y1="95" x2="245" y2="95" />
    <line x1="190" y1="110" x2="230" y2="110" />
    <circle cx="200" cy="130" r="5" fill="#10B981" />
    <line x1="210" y1="130" x2="240" y2="130" />
  </g>

  <!-- Hands typing -->
  <ellipse cx="120" cy="220" rx="28" ry="12" fill="#FBCFE8" opacity="0.85" />
  <ellipse cx="280" cy="220" rx="28" ry="12" fill="#FBCFE8" opacity="0.85" />
</svg>
