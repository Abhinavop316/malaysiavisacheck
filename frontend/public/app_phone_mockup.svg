<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 300" width="450" height="300">
  <defs>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="appScreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
  </defs>

  <rect width="450" height="300" fill="transparent" />

  <!-- Person Hands Holding Smartphone at an Angle -->
  <!-- Left hand -->
  <path d="M 120,300 C 140,240 180,180 230,170 C 250,190 240,260 210,300 Z" fill="#FBCFE8" opacity="0.8" />
  <!-- Right hand with thumb on screen -->
  <path d="M 330,300 C 310,230 280,170 240,160 C 230,175 250,240 280,300 Z" fill="#FBCFE8" opacity="0.9" />

  <!-- Smartphone Frame (Angled 28 degrees) -->
  <g transform="translate(230, 150) rotate(26)">
    <!-- Phone Outer Shell -->
    <rect x="-65" y="-130" width="130" height="250" rx="24" fill="url(#phoneBody)" stroke="#64748B" stroke-width="3" />

    <!-- Screen Display -->
    <rect x="-58" y="-120" width="116" height="230" rx="16" fill="url(#appScreenGrad)" />

    <!-- Notch / Camera Island -->
    <rect x="-18" y="-118" width="36" height="7" rx="3.5" fill="#020617" />

    <!-- Inside App Screen UI -->
    <!-- Top Half: Glowing Petronas Towers Image on Mobile Screen -->
    <g transform="translate(-58, -120)">
      <rect width="116" height="115" rx="14" fill="#07192F" />
      <!-- Miniature lit twin towers -->
      <polygon points="40,110 44,35 52,35 56,110" fill="#E2F1FC" />
      <polygon points="60,110 64,35 72,35 76,110" fill="#E2F1FC" />
      <rect x="52" y="70" width="12" height="4" fill="#FFFFFF" />
      <line x1="48" y1="35" x2="48" y2="20" stroke="#FFD54F" stroke-width="1.5" />
      <line x1="68" y1="35" x2="68" y2="20" stroke="#FFD54F" stroke-width="1.5" />
    </g>

    <!-- App Brand Logo in Mobile Screen -->
    <g transform="translate(0, 18) scale(0.4)">
      <text x="0" y="0" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="900" font-size="28">
        <tspan fill="#0C2340">MY</tspan>
        <tspan fill="#D32F2F">VISA</tspan>
      </text>
      <text x="0" y="16" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="700" font-size="8" fill="#475569" letter-spacing="2">
        MALAYSIA VISA
      </text>
    </g>

    <!-- App Title on Screen -->
    <text x="0" y="42" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="800" font-size="8" fill="#0F172A">
      Official Malaysia eVISA
    </text>
    <text x="0" y="52" text-anchor="middle" font-family="'Open Sans', sans-serif" font-weight="500" font-size="6.5" fill="#64748B">
      Facilitation &amp; Services
    </text>

    <!-- App Action Button on Screen -->
    <rect x="-40" y="65" width="80" height="18" rx="9" fill="#0C2340" />
    <text x="0" y="77" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="700" font-size="7.5" fill="#FFFFFF">
      Enter
    </text>

    <!-- Thumb Over Phone Screen (realistic touch) -->
    <ellipse cx="42" cy="35" rx="16" ry="24" fill="#FBCFE8" transform="rotate(-15, 42, 35)" />
    <!-- Nail -->
    <ellipse cx="44" cy="24" rx="7" ry="10" fill="#FED7AA" opacity="0.6" transform="rotate(-15, 44, 24)" />
  </g>
</svg>
